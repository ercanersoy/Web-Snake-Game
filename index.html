<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Yılan Oyunu – web tabanlı iki boyutlu yılan oyunu">
  <title>Yılan Oyunu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <button id="pause-btn" class="icon-btn hidden" data-i18n-label="pause.button">❚❚</button>

  <div id="ui">
    <!-- Ana menü -->
    <section id="screen-main" class="screen">
      <div class="panel">
        <h1 class="logo"><span data-i18n="logo.a"></span> <span data-i18n="logo.b"></span></h1>
        <p class="subtitle" data-i18n="subtitle"></p>
        <nav class="menu">
          <button class="btn primary" data-go="setup" data-i18n="menu.start"></button>
          <button class="btn" data-go="settings" data-i18n="menu.settings"></button>
          <button class="btn" data-go="about" data-i18n="menu.about"></button>
        </nav>
      </div>
    </section>

    <!-- Oyun yapılandırması -->
    <section id="screen-setup" class="screen hidden">
      <div class="panel wide">
        <h2 data-i18n="setup.title"></h2>
        <div class="setup-grid">
          <div class="map-box">
            <div class="field-label" data-i18n="setup.map"></div>
            <div class="map-picker">
              <button class="btn arrow" id="map-prev" data-i18n-label="setup.prevMap">‹</button>
              <canvas id="map-preview" width="400" height="260"></canvas>
              <button class="btn arrow" id="map-next" data-i18n-label="setup.nextMap">›</button>
            </div>
            <div class="map-title" id="map-name"></div>
            <div class="map-desc" id="map-desc"></div>
          </div>

          <div class="options">
            <div class="field-pair">
              <div class="field">
                <div class="field-label" data-i18n="setup.humans"></div>
                <div class="segmented" id="opt-humans">
                  <button data-value="1">1</button>
                  <button data-value="2">2</button>
                </div>
              </div>
              <div class="field">
                <div class="field-label" data-i18n="setup.computers"></div>
                <div class="segmented" id="opt-computers">
                  <button data-value="0">0</button>
                  <button data-value="1">1</button>
                  <button data-value="2">2</button>
                </div>
              </div>
            </div>
            <div class="controls-hint" id="controls-hint"></div>

            <div class="field" id="difficulty-field">
              <div class="field-label" data-i18n="setup.difficulty"></div>
              <div class="segmented" id="opt-difficulty">
                <button data-value="easy" data-i18n="diff.easy"></button>
                <button data-value="normal" data-i18n="diff.normal"></button>
                <button data-value="hard" data-i18n="diff.hard"></button>
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="opt-speed"><span data-i18n="setup.speed"></span> <b id="opt-speed-val"></b></label>
              <input type="range" id="opt-speed" min="1" max="10" step="1">
            </div>

            <div class="field">
              <label class="field-label" for="opt-target"><span data-i18n="setup.target"></span> <b id="opt-target-val"></b></label>
              <input type="range" id="opt-target" min="10" max="100" step="1">
            </div>

            <div class="field">
              <label class="field-label" for="opt-foods"><span data-i18n="setup.foods"></span> <b id="opt-foods-val"></b></label>
              <input type="range" id="opt-foods" min="2" max="10" step="1">
            </div>
          </div>
        </div>
        <div class="row-buttons">
          <button class="btn" data-go="main" data-i18n="common.back"></button>
          <button class="btn primary" id="start-btn" data-i18n="setup.start"></button>
        </div>
      </div>
    </section>

    <!-- Ayarlar -->
    <section id="screen-settings" class="screen hidden">
      <div class="panel">
        <h2 data-i18n="settings.title"></h2>
        <div class="settings-list">
          <div class="field">
            <label class="field-label" for="set-language" data-i18n="settings.language"></label>
            <select id="set-language">
              <option value="auto" data-i18n="lang.auto"></option>
              <option value="tr">Türkçe (Türkiye)</option>
              <option value="en-US">English (US)</option>
              <option value="en-GB">English (UK)</option>
            </select>
          </div>
          <label class="toggle"><input type="checkbox" id="set-sfx"><span data-i18n="settings.sfx"></span></label>
          <label class="toggle"><input type="checkbox" id="set-music"><span data-i18n="settings.music"></span></label>
          <div class="field">
            <label class="field-label" for="set-volume"><span data-i18n="settings.volume"></span> <b id="set-volume-val"></b></label>
            <input type="range" id="set-volume" min="0" max="100" step="1">
          </div>

          <div class="field-label section-title" data-i18n="settings.colors"></div>
          <div class="colors">
            <button class="color" data-color="p1"><span class="swatch"></span><span data-i18n="color.p1"></span></button>
            <button class="color" data-color="p2"><span class="swatch"></span><span data-i18n="color.p2"></span></button>
            <button class="color" data-color="c1"><span class="swatch"></span><span data-i18n="color.c1"></span></button>
            <button class="color" data-color="c2"><span class="swatch"></span><span data-i18n="color.c2"></span></button>
            <button class="color" data-color="food"><span class="swatch"></span><span data-i18n="color.food"></span></button>
            <button class="color" data-color="wall"><span class="swatch"></span><span data-i18n="color.wall"></span></button>
            <button class="color" data-color="background"><span class="swatch"></span><span data-i18n="color.background"></span></button>
          </div>
          <div class="palette hidden" id="palette">
            <div class="palette-title" id="palette-title"></div>
            <div class="palette-grid" id="palette-grid"></div>
          </div>
          <div class="field-label note" data-i18n="settings.colorsNote"></div>
        </div>
        <div class="row-buttons">
          <button class="btn" id="reset-settings" data-i18n="settings.reset"></button>
          <button class="btn primary" data-go="back" data-i18n="common.ok"></button>
        </div>
      </div>
    </section>

    <!-- Hakkında -->
    <section id="screen-about" class="screen hidden">
      <div class="panel">
        <h2 data-i18n="about.title"></h2>
        <div class="about" data-i18n-html="about.body"></div>
        <div class="row-buttons">
          <button class="btn primary" data-go="main" data-i18n="common.back"></button>
        </div>
      </div>
    </section>

    <!-- Duraklatma -->
    <section id="screen-pause" class="screen hidden">
      <div class="panel small">
        <h2 data-i18n="pause.title"></h2>
        <nav class="menu">
          <button class="btn primary" id="resume-btn" data-i18n="pause.resume"></button>
          <button class="btn" id="restart-btn" data-i18n="pause.restart"></button>
          <button class="btn" data-go="settings" data-i18n="menu.settings"></button>
          <button class="btn" id="quit-btn" data-i18n="pause.mainMenu"></button>
        </nav>
      </div>
    </section>

    <!-- Oyun sonu -->
    <section id="screen-over" class="screen hidden">
      <div class="panel small">
        <h2 id="over-title"></h2>
        <p id="over-reason" class="over-reason"></p>
        <div id="over-scores" class="over-scores"></div>
        <nav class="menu">
          <button class="btn primary" id="again-btn" data-i18n="over.again"></button>
          <button class="btn" data-go="setup" data-i18n="over.change"></button>
          <button class="btn" id="over-menu-btn" data-i18n="pause.mainMenu"></button>
        </nav>
      </div>
    </section>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
